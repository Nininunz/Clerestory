name: Deploy Clerestory update feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Stage update feed and legacy help redirect
        run: |
          mkdir -p _pages
          cp docs/appcast.xml _pages/appcast.xml
          cat > _pages/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>Clerestory Help</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/Nininunz/OpenYoink/blob/main/README.en.md#quick-start">
          <p><a href="https://github.com/Nininunz/OpenYoink/blob/main/README.en.md#quick-start">Clerestory help on GitHub</a></p>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
