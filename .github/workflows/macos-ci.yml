name: macOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Pushes to main and manual runs always build.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Include the old path of renamed files so moving code into docs/ still builds.
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > changed-files.txt
          cat changed-files.txt

          # Documentation-only paths. Root Markdown and docs/ are not read by the
          # build or tests. docs/appcast.xml and LICENSE are checked by
          # Scripts/check-identity.py, and TestFixtures/ holds Markdown test input,
          # so changes there still build.
          code=false
          while IFS= read -r path; do
            case "$path" in
              docs/appcast.xml) code=true ;;
              docs/*) ;;
              .github/ISSUE_TEMPLATE/*|.github/pull_request_template.md) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done < changed-files.txt

          # An empty file list is unexpected; build rather than skip.
          [ -s changed-files.txt ] || code=true
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  build-and-unit-tests:
    # Keep this name fixed: the main-branch ruleset requires it. A skipped job
    # reports success, so documentation-only PRs can merge without a macOS run.
    name: Build and unit tests (Xcode 27)
    needs: changes
    # Build when code changed, and also when change detection failed, so a
    # broken filter can never skip the required check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build Release and run unit tests
        env:
          CLERESTORY_CI_OUTPUT: ${{ runner.temp }}/clerestory-ci
        run: Scripts/test-ci.sh
      - name: Upload logs and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-ci-results-xcode-27.2
          path: |
            ${{ runner.temp }}/clerestory-ci/*.log
            ${{ runner.temp }}/clerestory-ci/unit-tests.xcresult
          if-no-files-found: warn
          retention-days: 14
